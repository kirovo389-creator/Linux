name: Android APK build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LinuxAI-${GITHUB_RUN_NUMBER}.apk
          sha256sum dist/LinuxAI-${GITHUB_RUN_NUMBER}.apk > dist/SHA256SUMS.txt
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxAI-APK-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: Linux AI Android v0.1.${{ github.run_number }}
          body: |
            Automated Android APK build from commit ${{ github.sha }}.
            - Android 8+; target SDK 34.
            - OpenAI-compatible model API and tool calling.
            - PRoot + Alpine ARM64 userspace is downloaded on first use.
            - This is a Linux userspace sandbox, not a separate Linux kernel/VM.
            Install the APK and review README for limitations.
          files: dist/*
          make_latest: true
          fail_on_unmatched_files: true
